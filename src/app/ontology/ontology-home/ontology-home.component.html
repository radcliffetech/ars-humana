<div class="space-y-6">
  <nav class="text-sm text-gray-500 mb-4">
    <a routerLink="/" class="hover:underline">Home</a>
    <span class="mx-2">›</span>
    <a routerLink="/ontology" class="hover:underline">Ontology</a>
  </nav>
  <h1 class="text-3xl font-bold mb-6 text-gray-800">Ontology Blueprint</h1>

  <div *ngFor="let act of scenesByAct | keyvalue">
    <h2 class="text-2xl font-semibold text-gray-700 mt-6 mb-3">{{ act.key }}</h2>
    <ul class="space-y-2">
      <li *ngFor="let scene of act.value">
        <a [routerLink]="['/scene', scene.id]" class="text-lg text-blue-500 hover:underline">
          {{ scene.title }}
        </a>
      </li>
    </ul>
  </div>
</div>
