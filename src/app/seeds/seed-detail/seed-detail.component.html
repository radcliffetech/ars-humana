<div *ngIf="seed" class="p-6 space-y-6">
  <nav class="text-sm text-gray-500 mb-4">
    <a routerLink="/" class="hover:underline">Home</a>
    <span class="mx-2">›</span>
    <a routerLink="/seeds" class="hover:underline">Seeds</a>
    <span class="mx-2">›</span>
    <span class="text-gray-700 font-semibold">{{ seed.label }}</span>
  </nav>
  <h1 class="text-3xl font-bold">{{ seed.label }}</h1>
  <p class="text-gray-700">{{ seed.description }}</p>

  <div *ngIf="seed.realizations?.length" class="space-y-4 pt-4">
    <h2 class="text-2xl font-semibold">Realizations</h2>
    <div *ngFor="let r of seed.realizations" class="bg-gray-100 p-4 rounded">
      <h3 class="font-medium">{{ r.title }}</h3>
      <p class="text-sm text-gray-600">{{ r.description }}</p>
      <iframe
        *ngIf="r.type === 'video'"
        class="w-full aspect-video mt-2"
        [src]="r.media?.videoUrl"
        frameborder="0"
        allowfullscreen
      >
      </iframe>
    </div>
  </div>
</div>
