<div class="space-y-6">
  <nav class="text-sm text-gray-500 mb-4">
    <a routerLink="/" class="hover:underline">Home</a>
    <span class="mx-2">›</span>
    <a routerLink="/glossary" class="hover:underline">Glossary</a>
  </nav>
  <h1 class="text-3xl font-bold mb-6">Glossary of Terms</h1>
  <ul>
    <li *ngFor="let term of terms" class="mb-4">
      <h2 class="text-xl font-semibold">{{ term.term }}</h2>
      <p class="text-lg text-gray-700">{{ term.definition }}</p>
    </li>
  </ul>
</div>
